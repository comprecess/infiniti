# DealBroker - AI Venture Architect
# Production config with SSL

# HTTPS - canonical domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dealbroker.ru;

    root /var/www/dealbroker;
    index index.html;

    # SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/dealbroker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealbroker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS www -> non-www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dealbroker.ru;

    ssl_certificate /etc/letsencrypt/live/dealbroker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealbroker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dealbroker.ru$request_uri;
}

# HTTP -> HTTPS redirect (all)
server {
    listen 80;
    listen [::]:80;
    server_name dealbroker.ru www.dealbroker.ru;
    return 301 https://dealbroker.ru$request_uri;
}
